services:
  - type: web
    name: brazasmar
    runtime: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: npm install --prefix backend
    startCommand: node backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: '*'
      - key: ADMIN_EMAIL
        value: admin@brazasmar.com
      - key: ADMIN_PASSWORD
        generateValue: true
    healthCheckPath: /api/menu
