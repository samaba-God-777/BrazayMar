<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Brazas$Mar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-body">
    <div class="auth-card">
        <a href="/" class="auth-back">
            <i class="fas fa-arrow-left"></i> Volver a la tienda
        </a>

        <div class="auth-logo">
            <div class="auth-logo-icon"><i class="fas fa-utensils"></i></div>
            <h1>Brazas<span class="auth-accent">$</span>Mar</h1>
            <p>Bienvenido de vuelta</p>
        </div>

        <div class="auth-tabs" role="tablist">
            <button class="auth-tab active" data-tab="cliente" role="tab" aria-selected="true">
                <i class="fas fa-user"></i> Soy cliente
            </button>
            <button class="auth-tab" data-tab="admin" role="tab" aria-selected="false">
                <i class="fas fa-crown"></i> Administrador
            </button>
        </div>

        <div id="loginError" class="auth-error" hidden></div>

        <form id="loginForm" class="auth-form" novalidate>
            <div class="form-group">
                <label for="identifier">
                    <span id="identifierLabel">Usuario o email</span>
                </label>
                <div class="input-icon">
                    <i class="fas fa-user"></i>
                    <input type="text" id="identifier" name="identifier" required autocomplete="username" placeholder="usuario@correo.com">
                </div>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="input-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
                    <button type="button" class="toggle-pwd" data-target="password" aria-label="Mostrar contraseña">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <label class="auth-remember">
                <input type="checkbox" id="remember" name="remember">
                Recordar sesión
            </label>

            <button type="submit" class="auth-submit" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i> Iniciar sesión
            </button>
        </form>

        <div class="auth-footer" id="authFooter">
            ¿No tienes cuenta? <a href="/registro">Crear cuenta</a>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="auth-ui.js"></script>
</body>
</html>
