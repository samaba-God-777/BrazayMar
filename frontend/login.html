<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Brazas$Mar Admin</title>
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: var(--admin-card);
            border: 1px solid var(--admin-border);
            border-radius: var(--admin-radius);
            padding: 40px;
            box-shadow: var(--admin-shadow);
        }

        .login-logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-logo h1 {
            font-size: 1.8rem;
            margin-top: 12px;
        }

        .login-logo p {
            color: var(--admin-text-secondary);
            margin-top: 6px;
        }

        .login-form .form-group {
            margin-bottom: 20px;
        }

        .login-form label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .login-form .form-control {
            width: 100%;
            padding: 14px 16px;
            border-radius: var(--admin-radius-sm);
            border: 1px solid var(--admin-border);
            background: rgba(255, 255, 255, 0.05);
            color: var(--admin-text);
            font-size: 1rem;
        }

        .login-form .form-control:focus {
            outline: none;
            border-color: var(--admin-primary);
        }

        .remember-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
            color: var(--admin-text-secondary);
        }

        .login-error {
            display: none;
            padding: 12px 16px;
            border-radius: var(--admin-radius-sm);
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--admin-danger);
            color: #fecaca;
            margin-bottom: 20px;
        }

        .login-hint {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--admin-border);
            font-size: 0.85rem;
            color: var(--admin-text-secondary);
            text-align: center;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
            color: var(--admin-primary);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-logo">
            <div class="logo-icon" style="margin: 0 auto;">
                <i class="fas fa-utensils"></i>
            </div>
            <h1>Brazas<span class="logo-accent">$</span>Mar</h1>
            <p>Panel de administración</p>
        </div>

        <div id="loginError" class="login-error"></div>

        <form id="loginForm" class="login-form">
            <div class="form-group">
                <label for="username"><i class="fas fa-user"></i> Usuario</label>
                <input type="text" id="username" name="username" class="form-control" required autocomplete="username" placeholder="admin">
            </div>

            <div class="form-group">
                <label for="password"><i class="fas fa-lock"></i> Contraseña</label>
                <input type="password" id="password" name="password" class="form-control" required autocomplete="current-password" placeholder="••••••••">
            </div>

            <label class="remember-row">
                <input type="checkbox" id="remember" name="remember">
                Recordar sesión
            </label>

            <button type="submit" class="btn-primary" id="loginBtn" style="width: 100%;">
                <i class="fas fa-sign-in-alt"></i> Iniciar sesión
            </button>
        </form>

        <p class="login-hint">Usuario por defecto: <strong>admin</strong> / <strong>admin123</strong></p>

        <a href="/" class="back-link">
            <i class="fas fa-arrow-left"></i> Volver a la tienda
        </a>
    </div>

    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await AuthService.verifySession();
            if (user) {
                window.location.href = AppConfig.ADMIN_DASHBOARD_URL;
                return;
            }

            const form = document.getElementById('loginForm');
            const errorBox = document.getElementById('loginError');
            const loginBtn = document.getElementById('loginBtn');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                errorBox.style.display = 'none';
                loginBtn.disabled = true;
                loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Entrando...';

                try {
                    await AuthService.login(
                        document.getElementById('username').value.trim(),
                        document.getElementById('password').value,
                        document.getElementById('remember').checked
                    );
                    window.location.href = AppConfig.ADMIN_DASHBOARD_URL;
                } catch (err) {
                    errorBox.textContent = err.message;
                    errorBox.style.display = 'block';
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Iniciar sesión';
                }
            });
        });
    </script>
</body>
</html>
