<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta - Brazas$Mar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-body">
    <div class="auth-card">
        <a href="/" class="auth-back">
            <i class="fas fa-arrow-left"></i> Volver a la tienda
        </a>

        <div class="auth-logo">
            <div class="auth-logo-icon"><i class="fas fa-user-plus"></i></div>
            <h1>Brazas<span class="auth-accent">$</span>Mar</h1>
            <p>Crea tu cuenta y empieza a pedir</p>
        </div>

        <div id="registerError" class="auth-error" hidden></div>

        <form id="registerForm" class="auth-form" novalidate>
            <div class="form-row">
                <div class="form-group">
                    <label for="name">Nombre completo</label>
                    <div class="input-icon">
                        <i class="fas fa-id-card"></i>
                        <input type="text" id="name" name="name" required minlength="2" placeholder="Tu nombre">
                    </div>
                </div>

                <div class="form-group">
                    <label for="username">Usuario</label>
                    <div class="input-icon">
                        <i class="fas fa-user"></i>
                        <input type="text" id="username" name="username" required minlength="3" pattern="[a-zA-Z0-9_.\-]{3,30}" placeholder="usuario123" autocomplete="username">
                    </div>
                    <small class="form-hint">3-30 caracteres (letras, números, . _ -)</small>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <div class="input-icon">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" name="email" required placeholder="tu@correo.com" autocomplete="email">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="phone">Teléfono</label>
                    <div class="input-icon">
                        <i class="fas fa-phone"></i>
                        <input type="tel" id="phone" name="phone" placeholder="+507 6000 0000">
                    </div>
                </div>

                <div class="form-group">
                    <label for="address">Dirección</label>
                    <div class="input-icon">
                        <i class="fas fa-map-marker-alt"></i>
                        <input type="text" id="address" name="address" placeholder="Calle, edificio, ciudad">
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="input-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" name="password" required minlength="6" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
                    <button type="button" class="toggle-pwd" data-target="password" aria-label="Mostrar contraseña">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <div class="password-strength" id="passwordStrength" aria-hidden="true">
                    <span></span><span></span><span></span><span></span>
                </div>
            </div>

            <div class="form-group">
                <label for="passwordConfirm">Confirmar contraseña</label>
                <div class="input-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="passwordConfirm" name="passwordConfirm" required minlength="6" placeholder="Repite tu contraseña" autocomplete="new-password">
                    <button type="button" class="toggle-pwd" data-target="passwordConfirm" aria-label="Mostrar contraseña">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <label class="auth-terms">
                <input type="checkbox" id="terms" required>
                Acepto los <a href="#">términos y condiciones</a> y la <a href="#">política de privacidad</a>
            </label>

            <button type="submit" class="auth-submit" id="registerBtn">
                <i class="fas fa-user-plus"></i> Crear cuenta
            </button>
        </form>

        <div class="auth-footer">
            ¿Ya tienes cuenta? <a href="/login">Inicia sesión</a>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="auth-ui.js"></script>
</body>
</html>
