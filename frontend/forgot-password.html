<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña - Brazas$Mar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-body">
    <div class="auth-card">
        <a href="/login" class="auth-back">
            <i class="fas fa-arrow-left"></i> Volver al login
        </a>

        <div class="auth-logo">
            <div class="auth-logo-icon"><i class="fas fa-key"></i></div>
            <h1>Recuperar contraseña</h1>
            <p>Ingresa tu email y te enviaremos un enlace para restablecer tu contraseña</p>
        </div>

        <div id="forgotMessage" class="auth-message" hidden></div>
        <div id="forgotError" class="auth-error" hidden></div>

        <form id="forgotForm" class="auth-form" novalidate>
            <div class="form-group">
                <label for="email">Email</label>
                <div class="input-icon">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" name="email" required autocomplete="email" placeholder="tu@correo.com">
                </div>
            </div>

            <button type="submit" class="auth-submit" id="forgotBtn">
                <i class="fas fa-paper-plane"></i> Enviar enlace de recuperación
            </button>
        </form>

        <div class="auth-footer">
            ¿Recordaste tu contraseña? <a href="/login">Iniciar sesión</a>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        const API_BASE = window.AppConfig?.API_BASE_URL || `${window.location.origin}/api`;

        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const btn = document.getElementById('forgotBtn');
            const errorEl = document.getElementById('forgotError');
            const messageEl = document.getElementById('forgotMessage');

            errorEl.hidden = true;
            messageEl.hidden = true;

            if (!email) {
                errorEl.textContent = 'Ingresa tu email';
                errorEl.hidden = false;
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enviando...';

            try {
                const response = await fetch(`${API_BASE}/auth/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Error al procesar la solicitud');
                }

                messageEl.innerHTML = `<i class="fas fa-check-circle"></i> ${data.message}`;
                messageEl.className = 'auth-message success';
                messageEl.hidden = false;

                if (data.resetUrl) {
                    const resetLink = document.createElement('div');
                    resetLink.style.cssText = 'margin-top: 12px; padding: 12px; background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 10px; font-size: 0.88rem;';
                    resetLink.innerHTML = `<strong>Enlace de recuperación:</strong><br><a href="${data.resetUrl}" style="color: #0369a1; word-break: break-all;">${window.location.origin}${data.resetUrl}</a>`;
                    messageEl.appendChild(resetLink);
                }

                document.getElementById('forgotForm').reset();
            } catch (error) {
                errorEl.textContent = error.message;
                errorEl.hidden = false;
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> Enviar enlace de recuperación';
            }
        });
    </script>
</body>
</html>
