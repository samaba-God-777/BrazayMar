<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer contraseña - Brazas$Mar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-body">
    <div class="auth-card">
        <a href="/login" class="auth-back">
            <i class="fas fa-arrow-left"></i> Volver al login
        </a>

        <div class="auth-logo">
            <div class="auth-logo-icon"><i class="fas fa-lock"></i></div>
            <h1>Nueva contraseña</h1>
            <p>Ingresa tu nueva contraseña</p>
        </div>

        <div id="resetError" class="auth-error" hidden></div>
        <div id="resetMessage" class="auth-message" hidden></div>

        <form id="resetForm" class="auth-form" novalidate>
            <input type="hidden" id="resetToken" name="token">

            <div class="form-group">
                <label for="newPassword">Nueva contraseña</label>
                <div class="input-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="newPassword" name="newPassword" required minlength="6" autocomplete="new-password" placeholder="Mínimo 6 caracteres">
                    <button type="button" class="toggle-pwd" data-target="newPassword" aria-label="Mostrar contraseña">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirmar contraseña</label>
                <div class="input-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6" autocomplete="new-password" placeholder="Repite tu contraseña">
                    <button type="button" class="toggle-pwd" data-target="confirmPassword" aria-label="Mostrar contraseña">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="auth-submit" id="resetBtn">
                <i class="fas fa-check"></i> Restablecer contraseña
            </button>
        </form>

        <div class="auth-footer">
            ¿Recordaste tu contraseña? <a href="/login">Iniciar sesión</a>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        const API_BASE = window.AppConfig?.API_BASE_URL || `${window.location.origin}/api`;

        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const tokenInput = document.getElementById('resetToken');

        if (!token) {
            document.getElementById('resetError').textContent = 'Token no válido. Solicita un nuevo enlace de recuperación.';
            document.getElementById('resetError').hidden = false;
            document.getElementById('resetForm').querySelector('button[type="submit"]').disabled = true;
        } else {
            tokenInput.value = token;
        }

        document.querySelectorAll('.toggle-pwd').forEach(btn => {
            btn.addEventListener('click', () => {
                const target = document.getElementById(btn.dataset.target);
                const icon = btn.querySelector('i');
                if (target.type === 'password') {
                    target.type = 'text';
                    icon.classList.replace('fa-eye', 'fa-eye-slash');
                } else {
                    target.type = 'password';
                    icon.classList.replace('fa-eye-slash', 'fa-eye');
                }
            });
        });

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const btn = document.getElementById('resetBtn');
            const errorEl = document.getElementById('resetError');
            const messageEl = document.getElementById('resetMessage');

            errorEl.hidden = true;
            messageEl.hidden = true;

            if (newPassword.length < 6) {
                errorEl.textContent = 'La contraseña debe tener al menos 6 caracteres';
                errorEl.hidden = false;
                return;
            }

            if (newPassword !== confirmPassword) {
                errorEl.textContent = 'Las contraseñas no coinciden';
                errorEl.hidden = false;
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Restableciendo...';

            try {
                const response = await fetch(`${API_BASE}/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Error al restablecer la contraseña');
                }

                messageEl.innerHTML = `<i class="fas fa-check-circle"></i> ${data.message}`;
                messageEl.className = 'auth-message success';
                messageEl.hidden = false;

                document.getElementById('resetForm').reset();

                setTimeout(() => {
                    window.location.href = '/login';
                }, 3000);
            } catch (error) {
                errorEl.textContent = error.message;
                errorEl.hidden = false;
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-check"></i> Restablecer contraseña';
            }
        });
    </script>
</body>
</html>
